<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globe Malaria Indonesia 2020–2024</title>
<style>

:root{--bg:#070d12;--panel:#101b22;--line:#243742;--tx:#e9f0ec;--mut:#8ea6a6;--acc:#f2b84b}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
header{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;gap:14px;align-items:center;padding:10px 18px;background:linear-gradient(#070d12 70%,transparent)}
h1{font:600 19px Georgia,serif;flex:1}
h1 small{display:block;font:12px "Segoe UI",sans-serif;color:var(--mut)}
button,select{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--acc)}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#back{display:none;background:var(--acc);color:#1b1304;border-color:var(--acc);font-weight:600}
#globe{position:fixed;inset:0}
aside{position:fixed;top:64px;right:14px;bottom:14px;width:370px;max-width:calc(100vw - 28px);z-index:4;background:rgba(16,27,34,.95);border:1px solid var(--line);border-radius:10px;padding:16px;overflow:auto;transition:transform .35s}
aside.hide{transform:translateX(120%)}
aside h2{font:600 24px Georgia,serif;margin-bottom:2px}
.sub{color:var(--mut);margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat.w{grid-column:1/-1}
.stat b{display:block;font:600 22px Georgia,serif}
.stat span{color:var(--mut);font-size:12px}
h3{font-size:13px;color:var(--mut);font-weight:600;margin:14px 0 6px}
.row{display:flex;width:100%;gap:8px;align-items:center;text-align:left;margin-bottom:6px;padding:8px 10px}
.row b{flex:1}.row span{color:var(--mut);font-size:12px;text-align:right}
.row.top{border-color:#d9381e}
.lnk{padding:3px 10px;font-size:12px;margin-bottom:10px}
svg text{fill:var(--mut);font:10px "Segoe UI",sans-serif}
.note{color:var(--mut);font-size:12px;margin-top:10px}
.legend{position:fixed;left:14px;bottom:14px;z-index:3;background:rgba(16,27,34,.9);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--mut)}
.bar{height:8px;width:210px;border-radius:4px;margin:5px 0 2px;background:linear-gradient(90deg,#9acd5b,#f2c744,#f08a24,#d9381e,#7f1d1d)}
.legend .e{display:flex;justify-content:space-between}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:#6b7378;margin-right:5px;vertical-align:-1px}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;background:rgba(16,27,34,.9);border:1px solid var(--line);border-radius:20px;padding:6px 16px;color:var(--mut);pointer-events:none}
.tt{font:13px/1.45 "Segoe UI",sans-serif;padding:6px 10px;background:#0b1319ee;border:1px solid #3a5260;border-radius:6px}
.tt b{font:600 15px Georgia,serif}
@media(max-width:700px){aside{top:auto;height:52vh}.legend{display:none}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}

.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;color:#10181d;font-weight:600;margin-top:2px}
.legend .t{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.legend .t i{width:10px;height:10px;border-radius:50%;vertical-align:-1px}
</style>
</head>
<body>
<header>
  <h1>Globe Malaria Indonesia<small>Data nasional: malaria_world_wide.docx</small></h1>
  <label>Tahun <select id="year"></select></label>
  <button id="back">← Kembali</button>
</header>
<div id="globe"></div>
<aside id="panel" class="hide"></aside>
<div id="hint">Klik Indonesia atau salah satu titik provinsi untuk zoom-in</div>
<div class="legend"><div>Beban kasus nasional (skala logaritmik)</div><div class="bar"></div>
 <div class="e"><span>rendah</span><span>sangat tinggi</span></div>
 <div class="t"><span style="color:var(--tx)">Titik provinsi (klasifikasi umum)</span>
 <span><i style="background:#9acd5b"></i> Mayoritas sudah eliminasi</span>
 <span><i style="background:#f08a24"></i> Endemis rendah–sedang</span>
 <span><i style="background:#d9381e"></i> Endemis tinggi</span></div></div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.33.1/dist/globe.gl.min.js"></script>
<script>
const YEARS=[2020,2021,2022,2023,2024],M=1e6;
/* ===== DATA nasional: persis dari file malaria_globe_v2.html ===== */
const ID={cases:[.8,.815,.83,.85,.865].map(x=>x*M),deaths:[1300,1350,1380,1400,1420],pct:[.3,.3,.3,.3,.3]};
const CMP=[['Nigeria',[65,66.8,67.2,68.1,69.5]],['India',[4.8,4.2,3.7,3.3,3.1]],['Pakistan',[.4,.5,2.6,2.7,2.5]],['Papua Nugini',[.95,1,1.05,1.1,1.15]],['Brasil',[.145,.14,.138,.135,.132]]].map(([n,a])=>({n,cases:a.map(x=>x*M)}));
/* ===== Wilayah & provinsi ===== */
const TN=['Mayoritas sudah eliminasi','Endemis rendah–sedang','Endemis tinggi'],TC=['#9acd5b','#f08a24','#d9381e'];
const REG=[['Sumatra',-0.5,101,.6],['Jawa',-7.4,110.5,.5],['Bali & Nusa Tenggara',-9,120,.55],['Kalimantan',0.5,114,.6],['Sulawesi',-2,121.3,.55],['Maluku',-2,128,.55],['Papua',-4.5,138,.6]];
/* [nama, ibu kota, lat, lng, wilayah, tingkat 0-2, kasus (isi bila punya data, mis. 12345)] */
const P=[
['Aceh','Banda Aceh',5.55,95.32,0,1,null],['Sumatera Utara','Medan',3.59,98.67,0,1,null],['Sumatera Barat','Padang',-0.95,100.35,0,1,null],['Riau','Pekanbaru',0.51,101.45,0,1,null],['Kepulauan Riau','Tanjungpinang',0.92,104.45,0,1,null],['Jambi','Jambi',-1.61,103.61,0,1,null],['Sumatera Selatan','Palembang',-2.98,104.75,0,1,null],['Kepulauan Bangka Belitung','Pangkalpinang',-2.13,106.11,0,1,null],['Bengkulu','Bengkulu',-3.79,102.26,0,1,null],['Lampung','Bandar Lampung',-5.43,105.26,0,1,null],
['Banten','Serang',-6.12,106.15,1,0,null],['DKI Jakarta','Jakarta',-6.21,106.85,1,0,null],['Jawa Barat','Bandung',-6.91,107.61,1,0,null],['Jawa Tengah','Semarang',-6.97,110.42,1,0,null],['DI Yogyakarta','Yogyakarta',-7.8,110.37,1,0,null],['Jawa Timur','Surabaya',-7.25,112.75,1,0,null],
['Bali','Denpasar',-8.65,115.22,2,0,null],['Nusa Tenggara Barat','Mataram',-8.58,116.11,2,1,null],['Nusa Tenggara Timur','Kupang',-10.18,123.61,2,2,null],
['Kalimantan Barat','Pontianak',-0.03,109.33,3,1,null],['Kalimantan Tengah','Palangka Raya',-2.21,113.92,3,1,null],['Kalimantan Selatan','Banjarmasin',-3.32,114.59,3,1,null],['Kalimantan Timur','Samarinda',-0.5,117.15,3,1,null],['Kalimantan Utara','Tanjung Selor',2.84,117.37,3,1,null],
['Sulawesi Utara','Manado',1.47,124.84,4,1,null],['Gorontalo','Gorontalo',0.54,123.06,4,1,null],['Sulawesi Tengah','Palu',-0.9,119.87,4,1,null],['Sulawesi Barat','Mamuju',-2.68,118.89,4,1,null],['Sulawesi Selatan','Makassar',-5.15,119.41,4,1,null],['Sulawesi Tenggara','Kendari',-3.97,122.51,4,1,null],
['Maluku','Ambon',-3.7,128.18,5,2,null],['Maluku Utara','Sofifi',0.73,127.57,5,2,null],
['Papua Barat','Manokwari',-0.86,134.06,6,2,null],['Papua Barat Daya','Sorong',-0.88,131.26,6,2,null],['Papua','Jayapura',-2.53,140.72,6,2,null],['Papua Tengah','Nabire',-3.37,135.48,6,2,null],['Papua Pegunungan','Wamena',-4.1,138.95,6,2,null],['Papua Selatan','Merauke',-8.5,140.4,6,2,null]
].map((a,i)=>({i,name:a[0],cap:a[1],lat:a[2],lng:a[3],r:a[4],t:a[5],cases:a[6]}));
const inReg=r=>P.filter(p=>p.r===r);

/* ===== helpers ===== */
let yi=4,lv=0,selR=null,selP=null,hov=false;
const fmt=n=>Math.round(n).toLocaleString('id-ID');
const fpct=p=>'~'+p.toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:2})+'%';
const ST=[[5.4,[154,205,91]],[6.2,[242,199,68]],[6.8,[240,138,36]],[7.5,[217,56,30]],[8.4,[127,29,29]]];
function rgb(c){const l=Math.log10(c);if(l<=ST[0][0])return ST[0][1];
  for(let i=1;i<ST.length;i++)if(l<=ST[i][0]){const f=(l-ST[i-1][0])/(ST[i][0]-ST[i-1][0]);return ST[i][1].map((v,j)=>v+(ST[i-1][1][j]-v)*(1-f))}
  return ST[4][1]}
const css=(c,a=1)=>`rgba(${rgb(c).map(Math.round).join(',')},${a})`;
const iso=d=>d.properties.ISO_A3!=='-99'?d.properties.ISO_A3:d.properties.ADM0_A3;
const isID=d=>iso(d)==='IDN';
const sumHTML=()=>`<div class="tt"><b>Indonesia</b> · ${YEARS[yi]}<br>Total kasus: ${fmt(ID.cases[yi])}<br>Total kematian: ${fmt(ID.deaths[yi])}<br>Beban global: ${fpct(ID.pct[yi])}<br>Klik untuk zoom-in</div>`;

/* ===== globe ===== */
const el=document.getElementById('globe');
const world=Globe()(el)
 .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/earth-night.jpg')
 .backgroundColor('#070d12').atmosphereColor('#6fb7a8').atmosphereAltitude(.17)
 .polygonsTransitionDuration(300).polygonSideColor(()=>'rgba(0,0,0,.3)').polygonStrokeColor(()=>'rgba(0,0,0,.35)')
 .polygonLabel(d=>isID(d)?sumHTML():(d.properties.NAME||''))
 .onPolygonHover(d=>{hov=!!d&&isID(d);el.style.cursor=hov?'pointer':'grab';stylePoly()})
 .onPolygonClick(d=>{if(isID(d)&&lv===0)showNat()})
 .pointLat('lat').pointLng('lng').pointColor(d=>TC[d.t]).pointAltitude(d=>.01+.03*d.t)
 .pointRadius(d=>lv>=2?.35:.22).pointLabel(d=>`<div class="tt"><b>${d.name}</b><br>${d.cap}<br>${TN[d.t]}</div>`).onPointClick(pickP)
 .ringLat('lat').ringLng('lng').ringColor(()=>t=>`rgba(255,255,255,${1-t})`).ringMaxRadius(2).ringPropagationSpeed(1.4).ringRepeatPeriod(1200)
 .labelLat('lat').labelLng('lng').labelText(d=>d.cap).labelSize(.5).labelDotRadius(.2)
 .labelColor(()=>'#fff').labelResolution(2).labelAltitude(.02).onLabelClick(pickP);
const C0=world.controls();C0.autoRotate=true;C0.autoRotateSpeed=.4;C0.minDistance=110;C0.maxDistance=600;
world.pointOfView({lat:-2.5,lng:118,altitude:2.5});
addEventListener('resize',()=>world.width(innerWidth).height(innerHeight));
function stylePoly(){world
 .polygonCapColor(d=>isID(d)?css(ID.cases[yi],lv?1:(hov?1:.9)):'rgba(60,68,74,.5)')
 .polygonAltitude(d=>isID(d)?(lv?.012:hov?.03:.015):.003)}
fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
 .then(r=>r.json()).then(g=>{world.polygonsData(g.features.filter(f=>f.properties.ISO_A3!=='ATA'));stylePoly()})
 .catch(()=>{const h=document.getElementById('hint');h.textContent='Batas negara gagal dimuat. Periksa koneksi internet lalu muat ulang.';h.style.color='#f08a6a'});
world.pointsData(P);stylePoly();

/* ===== UI ===== */
const panel=document.getElementById('panel'),ys=document.getElementById('year'),back=document.getElementById('back'),hint=document.getElementById('hint');
ys.innerHTML=YEARS.map((y,i)=>`<option value="${i}" ${i===4?'selected':''}>${y}</option>`).join('');
ys.onchange=()=>{yi=+ys.value;stylePoly();render()};
function sync(){
  const pts=lv>=2?inReg(selR):P;world.pointsData(pts)
   .labelsData(lv===2?pts:lv===3?[selP]:[]).ringsData(lv===3?[selP]:[]);
  stylePoly();render();panel.classList.toggle('hide',lv===0);back.style.display=lv?'':'none';hint.style.display=lv?'none':'';
  back.textContent=lv===3?'← Kembali ke '+REG[selR][0]:lv===2?'← Kembali ke Indonesia':'← Kembali ke Global View';
}
function showNat(){lv=1;selR=selP=null;C0.autoRotate=false;world.pointOfView({lat:-2.5,lng:118,altitude:1.15},1500);sync()}
function pickR(i){lv=2;selR=i;selP=null;const r=REG[i];world.pointOfView({lat:r[1],lng:r[2],altitude:r[3]},1300);sync()}
function pickP(p){lv=3;selP=p;selR=p.r;world.pointOfView({lat:p.lat,lng:p.lng,altitude:.3},1200);sync()}
back.onclick=()=>{
  if(lv===3)pickR(selR);else if(lv===2)showNat();
  else{lv=0;selR=selP=null;C0.autoRotate=true;world.pointOfView({lat:-2.5,lng:118,altitude:2.5},1500);sync()}
};
window.goR=pickR;window.goP=i=>pickP(P[i]);

function trend(vals,label){
  const W=330,H=118,p=14,mx=Math.max(...vals,1),s=(W-p*2)/5,bw=s-10;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">`+vals.map((v,i)=>{
    const h=(H-40)*v/mx,x=p+i*s+5;
    return `<rect x="${x}" y="${H-20-h}" width="${bw}" height="${Math.max(h,1)}" rx="2" fill="${css(ID.cases[i],i===yi?1:.45)}"/>
    <text x="${x+bw/2}" y="${H-7}" text-anchor="middle" ${i===yi?'style="fill:#e9f0ec;font-weight:700"':''}>${YEARS[i]}</text>
    <text x="${x+bw/2}" y="${H-24-h}" text-anchor="middle">${v>=1e6?(v/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt':v>=1e3?Math.round(v/1e3)+' rb':v}</text>`}).join('')+'</svg>';
}
const tag=t=>`<span class="tag" style="background:${TC[t]}">${TN[t]}</span>`;
const NOTE='<p class="note">Klasifikasi tingkat endemisitas bersifat umum (pola wilayah), bukan angka resmi per provinsi. Dokumen sumber hanya memuat data tingkat nasional. Isi kolom terakhir pada array <code>P</code> di kode bila Anda punya data kasus per provinsi.</p>';
function render(){
  if(!lv)return;let h='';
  if(lv===1){
    const ch=(ID.cases[yi]-ID.cases[0])/ID.cases[0]*100;
    h=`<h2>Indonesia</h2><div class="sub">Nasional · ${YEARS[yi]}</div><div class="stats">
     <div class="stat w"><b>${fmt(ID.cases[yi])}</b><span>Estimasi jumlah kasus (${YEARS[yi]})</span></div>
     <div class="stat"><b>${fmt(ID.deaths[yi])}</b><span>Jumlah kematian</span></div>
     <div class="stat"><b>${fpct(ID.pct[yi])}</b><span>Beban kasus global</span></div></div>
     <p class="sub" style="margin:-4px 0 0">${ch>=0?'▲':'▼'} ${Math.abs(ch).toFixed(1).replace('.',',')}% dibanding 2020</p>
     <h3>Wilayah (klik untuk zoom-in)</h3>`+REG.map((r,i)=>{const m=inReg(i),t=Math.max(...m.map(p=>p.t));
      return `<button class="row ${t===2?'top':''}" onclick="goR(${i})"><b>${r[0]}</b><span>${m.length} provinsi<br>${TN[t]}</span></button>`}).join('')+
     `<h3>Tren kasus tahunan</h3>${trend(ID.cases,'Tren kasus')}<h3>Tren kematian tahunan</h3>${trend(ID.deaths,'Tren kematian')}
     <h3>Perbandingan kasus ${YEARS[yi]} (negara lain dari dokumen)</h3>`+
     [{n:'Indonesia',cases:ID.cases}].concat(CMP).sort((a,b)=>b.cases[yi]-a.cases[yi]).map(c=>`<div class="row" style="${c.n==='Indonesia'?'border-color:var(--acc)':''}"><b>${c.n}</b><span>${fmt(c.cases[yi])}</span></div>`).join('')+NOTE;
  }else if(lv===2){
    h=`<h2>${REG[selR][0]}</h2><div class="sub">Wilayah · ${inReg(selR).length} provinsi</div><h3>Provinsi (klik untuk detail)</h3>`+
     inReg(selR).map(p=>`<button class="row ${p.t===2?'top':''}" onclick="goP(${p.i})"><b>${p.name}</b><span>${p.cap}<br>${TN[p.t]}</span></button>`).join('')+NOTE;
  }else{
    const p=selP;
    h=`<h2>${p.name}</h2><div class="sub">Provinsi · ${REG[p.r][0]}</div>${tag(p.t)}
     <div class="stats" style="margin-top:12px"><div class="stat w"><b>${p.cap}</b><span>Ibu kota provinsi</span></div>
     <div class="stat w"><b>${p.cases!=null?fmt(p.cases):'Belum ada data'}</b><span>${p.cases!=null?'Kasus malaria':'Dokumen tidak memuat kasus per provinsi'}</span></div></div>
     <p class="sub">Koordinat: ${Math.abs(p.lat).toFixed(2)}° ${p.lat<0?'LS':'LU'}, ${p.lng.toFixed(2)}° BT</p>${NOTE}`;
  }
  panel.innerHTML=h;
}
</script>
</body>
</html>
